<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hostel Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hostel Application</h1>
  </header>

  <main>
    <section class="portal">
      <form>
        <label>Select Hostel:</label>
        <select id="hostelChoice">
          <option>Hostel A</option>
          <option>Hostel B</option>
          <option>Hostel C</option>
        </select>
        <label>Room Preference:</label>
        <select id="roomChoice">
          <option>Single Room</option>
          <option>Double Room</option>
        </select>
        <button type="button" onclick="allocateRoom()">Submit Application</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 University Hostel Allocation System</p>
  </footer>
</body>
</html>
