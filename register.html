<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Student Registration</h1></header>
  <main>
    <section class="portal">
      <form>
        <input type="text" id="studentName" placeholder="Full Name" required>
        <input type="text" id="studentCourse" placeholder="Course" required>
        <input type="text" id="studentYear" placeholder="Year of Study" required>
        <input type="email" id="newStudentEmail" placeholder="Email Address" required>
        <input type="password" id="newStudentPassword" placeholder="Create Password" required>
        <button type="button" onclick="registerStudent()">Register</button>
      </form>
    </section>
  </main>
</body>
</html>
