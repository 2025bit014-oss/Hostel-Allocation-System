<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Registration</h1>
  </header>

  <main>
    <section class="portal">
      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="text" placeholder="Course" required>
        <input type="text" placeholder="Year of Study" required>
        <input type="email" id="newStudentEmail" placeholder="Email Address" required>
        <input type="password" placeholder="Create Password" required>
        <button type="button" onclick="registerStudent()">Register</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 University Hostel Allocation System</p>
  </footer>
</body>
</html>
