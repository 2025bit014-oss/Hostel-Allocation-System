<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Manual Hostel Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="fas fa-building me-2"></i>UniHostel | Student Portal</span>
            <div class="navbar-nav ms-auto flex-row align-items-center">
                <span id="userDisplay" class="text-light me-3 small"></span>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout <i class="fas fa-sign-out-alt ms-1"></i></button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="alertContainer"></div>

        <div class="row g-4">
            <!-- Manual Application Form -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="mb-0"><i class="fas fa-edit me-2"></i>Manual Hostel & Room Application Form</h5>
                    </div>
                    <div class="card-body p-4">
                        <form id="manualApplicationForm">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" value="Waiswa Edrick" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Registration Number</label>
                                    <input type="text" class="form-control" id="regNumber" value="2025/BIT/001" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Year of Study</label>
                                    <select class="form-select" id="yearOfStudy">
                                        <option value="Year 1">Year 1</option>
                                        <option value="Year 2">Year 2</option>
                                        <option value="Year 3" selected>Year 3</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Type Preferred Hostel / Block</label>
                                    <input type="text" class="form-control" id="inputHostel" placeholder="e.g. Block C" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Type Preferred Room Number</label>
                                    <input type="text" class="form-control" id="inputRoom" placeholder="e.g. Room 204" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Submit Manual Application</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Status Tracker -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-dark text-white py-3">
                        <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>My Application Tracking</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush" id="trackingDetails">
                            <li class="list-group-item text-muted text-center">No active submission found yet. Submit the form to track.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Security check
        if (localStorage.getItem('uniHostelRole') !== 'student') {
            window.location.href = 'index.html';
        }
        document.getElementById('userDisplay').innerText = `Logged in: ${localStorage.getItem('uniHostelUser') || 'Student'}`;

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        // Handle Form Submission and Sync with LocalStorage
        document.getElementById('manualApplicationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('fullName').value;
            const regNo = document.getElementById('regNumber').value;
            const hostel = document.getElementById('inputHostel').value;
            const room = document.getElementById('inputRoom').value;

            const newApplication = {
                name: name,
                regNo: regNo,
                choice: `${hostel}, ${room}`,
                status: 'Pending Review'
            };

            // Fetch existing applications or initialize
            let applications = JSON.parse(localStorage.getItem('hostelApplications')) || [];
            
            // Check if user already applied, update or push new
            const existingIndex = applications.findIndex(app => app.regNo === regNo);
            if (existingIndex >= 0) {
                applications[existingIndex] = newApplication;
            } else {
                applications.push(newApplication);
            }

            localStorage.setItem('hostelApplications', JSON.stringify(applications));

            // Update UI tracker
            document.getElementById('trackingDetails').innerHTML = `
                <li class="list-group-item d-flex justify-content-between align-items-center">Applicant: <span class="fw-bold">${name}</span></li>
                <li class="list-group-item d-flex justify-content-between align-items-center">Requested Space: <span class="fw-bold text-primary">${hostel}, ${room}</span></li>
                <li class="list-group-item d-flex justify-content-between align-items-center">Status: <span class="badge bg-warning text-dark">Pending Review</span></li>
            `;

            document.getElementById('alertContainer').innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle me-2"></i>Your manual application has been sent to the Admin queue successfully!
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
