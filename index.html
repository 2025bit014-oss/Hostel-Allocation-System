<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University Hostel Allocation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏫 University Hostel Allocation System</h1>
    <p>Fair • Efficient • Transparent</p>
  </header>

  <main>
    <!-- Admin Login Portal -->
    <section id="adminLogin" class="portal">
      <h2>Admin Sign In</h2>
      <small>Authorized personnel only</small>
      <form>
        <input type="email" id="adminEmail" placeholder="Enter Admin Email" required>
        <input type="password" id="adminPassword" placeholder="Enter your password" required>
        <button type="button" onclick="adminLogin()">Login as Admin</button>
        <p>Don’t have an account? <a href="register_admin.html">Sign Up</a></p>
      </form>
    </section>

    <!-- Student Login Portal -->
    <section id="studentLogin" class="portal">
      <h2>Student Sign In</h2>
      <small>Enter your email</small>
      <form>
        <input type="email" id="studentEmail" placeholder="Enter Student Email" required>
        <input type="password" id="studentPassword" placeholder="Enter Password" required>
        <button type="button" onclick="studentLogin()">Login as Student</button>
        <p><a href="#" onclick="forgotPassword()">Forgot Password?</a></p>
        <p>Don’t have an account? <a href="register.html">Sign Up</a></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 University Hostel Allocation System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
