<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University Hostel Allocation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏫 University Hostel Allocation System</h1>
    <p>Fair • Efficient • Transparent</p>
  </header>

  <main>
    <!-- Login Section -->
    <section id="loginScreen" class="screen">
      <h2>Login</h2>
      <form>
        <input type="text" id="studentId" placeholder="Enter Student ID" required>
        <input type="password" id="password" placeholder="Enter Password" required>
        <button type="button" onclick="showScreen('applicationScreen')">Login</button>
        <p>New user? <a href="#" onclick="showScreen('registerScreen')">Register here</a></p>
      </form>
    </section>

    <!-- Registration Section -->
    <section id="registerScreen" class="screen hidden">
      <h2>Student Registration</h2>
      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="text" placeholder="Course" required>
        <input type="text" placeholder="Year of Study" required>
        <input type="email" placeholder="Email Address" required>
        <button type="button" onclick="showScreen('applicationScreen')">Submit Registration</button>
      </form>
    </section>

    <!-- Application Section -->
    <section id="applicationScreen" class="screen hidden">
      <h2>Hostel Application</h2>
      <form>
        <label>Select Hostel:</label>
        <select>
          <option>Hostel A</option>
          <option>Hostel B</option>
          <option>Hostel C</option>
        </select>
        <label>Room Preference:</label>
        <select>
          <option>Single Room</option>
          <option>Double Room</option>
        </select>
        <button type="button" onclick="showScreen('allocationScreen')">Submit Application</button>
      </form>
    </section>

    <!-- Allocation Results Section -->
    <section id="allocationScreen" class="screen hidden">
      <h2>Allocation Results</h2>
      <div class="result-box">
        <p>🎉 Congratulations! You have been allocated <strong>Hostel A, Room 12</strong>.</p>
      </div>
      <button type="button" onclick="showScreen('loginScreen')">Logout</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 University Hostel Allocation System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
