<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Hostel Allocation System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand fw-bold"><i class="fas fa-building me-2"></i>UniHostel Portal</span>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-circle fa-3x text-primary mb-2"></i>
                        <h3 class="fw-bold">Hostel System Login</h3>
                        <p class="text-muted small">Select your role and enter credentials to access your portal</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginRole" class="form-label fw-bold">Select Role</label>
                            <select class="form-select" id="loginRole" required>
                                <option value="student">Student (Manual Application & Status)</option>
                                <option value="admin">Admin / Warden (Review & Reports)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="userEmail" class="form-label fw-bold">Email / Reg Number</label>
                            <input type="text" class="form-control" id="userEmail" placeholder="e.g. 2025/BIT/001 or admin@uni.edu" required>
                        </div>
                        <div class="mb-3">
                            <label for="userPassword" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="userPassword" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Login Securely</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 University Hostel Allocation System</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const identifier = document.getElementById('userEmail').value;

            // Save login state locally
            localStorage.setItem('uniHostelUser', identifier);
            localStorage.setItem('uniHostelRole', role);

            if (role === 'student') {
                window.location.href = 'student-dashboard.html';
            } else {
                window.location.href = 'admin-dashboard.html';
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
