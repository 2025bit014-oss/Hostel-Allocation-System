<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University Hostel Allocation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏫 University Hostel Allocation System</h1>
    <p>Plan Smart | Manage Well | Live Comfortably</p>
  </header>

  <main>
    <!-- Admin Portal -->
    <section class="portal">
      <h2>Admin Portal</h2>
      <small>Authorized personnel only</small>
      <form>
        <input type="email" id="adminEmail" placeholder="Admin Email Address" required>
        <input type="password" id="adminPassword" placeholder="Enter your password" required>
        <button type="button" onclick="adminLogin()">Sign In</button>
        <p><a href="register_admin.html">Sign Up as Admin</a></p>
        <p><a href="#" onclick="forgotPassword()">Forgot your password?</a></p>
      </form>
    </section>

    <!-- Student Portal -->
    <section class="portal">
      <h2>Student Portal</h2>
      <small>Enter your email</small>
      <form>
        <input type="email" id="studentEmail" placeholder="Student Email Address" required>
        <input type="password" id="studentPassword" placeholder="Enter your password" required>
        <button type="button" onclick="studentLogin()">Sign In</button>
        <p><a href="register.html">Sign Up as Student</a></p>
        <p><a href="#" onclick="forgotPassword()">Forgot your password?</a></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 University Hostel Allocation System</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
