<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Admin Registration</h1></header>
  <main>
    <section class="portal">
      <form>
        <input type="text" id="adminName" placeholder="Full Name" required>
        <input type="email" id="newAdminEmail" placeholder="Admin Email Address" required>
        <input type="password" id="newAdminPassword" placeholder="Create Password" required>
        <button type="button" onclick="registerAdmin()">Register</button>
      </form>
    </section>
  </main>
</body>
</html>
